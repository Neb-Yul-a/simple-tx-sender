<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Ethereum Tx Sender</title>
    <!-- Ethers.js v6 UMD CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.15.0/ethers.umd.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem;
      }
      label {
        display: block;
        margin: 0.5rem 0;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 0.5rem;
        margin-top: 0.2rem;
        font-family: monospace;
      }
      textarea {
        resize: vertical;
      }
      button {
        padding: 0.6rem 1.2rem;
        margin-top: 1rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #status,
      #txStatus {
        margin-top: 1rem;
        white-space: pre-wrap;
      }
      .row {
        display: flex;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .row > * {
        flex: 1 1 auto;
      }
      .muted {
        color: #666;
        font-size: 0.9em;
      }
      #signedBox {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <!-- Wallet selection if multiple providers detected -->
    <div id="providerSelectContainer" style="display: none">
      <label for="providerSelect"
        >Select Wallet:
        <select id="providerSelect"></select>
      </label>
    </div>

    <div class="row">
      <button id="connectButton">Connect Wallet</button>
      <div id="status">Not connected</div>
    </div>

    <label>
      To:
      <input type="text" id="toInput" placeholder="0x" />
    </label>
    <label>
      Value (ETH):
      <input type="text" id="valueInput" placeholder="0.0" />
    </label>
    <label>
      Calldata (hex):
      <textarea
        id="dataInput"
        rows="10"
        placeholder="자동 설정 (빈칸 = ETH transfer)"
      ></textarea>
    </label>
    <label>
      Nonce (optional):
      <input type="text" id="nonceInput" placeholder="자동 설정" />
    </label>

    <div class="row">
      <button id="sendButton" disabled>Send Tx</button>
      <button id="signButton" disabled>Sign Tx (no send)</button>
    </div>

    <div class="row">
      <label style="flex: 1"
        >Max Priority Fee (gwei, optional)
        <input type="text" id="mpgInput" placeholder="0 = auto" />
      </label>
      <label style="flex: 1"
        >Max Fee (gwei, optional)
        <input type="text" id="mfgInput" placeholder="0 = auto" />
      </label>
    </div>

    <div id="txStatus"></div>

    <div id="signedBox" style="display: none">
      <label>
        Signed Raw Tx (hex):
        <textarea id="signedOutput" rows="4" readonly></textarea>
      </label>
      <div class="row">
        <button id="copySigned" style="flex: 0 0 auto">Copy</button>
        <div id="signedHash" class="muted"></div>
      </div>
      <div class="muted">
        Note: Some wallets (e.g. MetaMask extension) do not support
        <code>eth_signTransaction</code>. In that case, try Frame/OKX/Rabby or a
        wallet that supports sign-only.
      </div>
    </div>

    <script>
      // Populate wallet providers if multiple
      const providerSelectContainer = document.getElementById(
        "providerSelectContainer",
      );
      const providerSelect = document.getElementById("providerSelect");
      if (
        window.ethereum &&
        Array.isArray(window.ethereum.providers) &&
        window.ethereum.providers.length > 1
      ) {
        const list = window.ethereum.providers;
        list.forEach((p, idx) => {
          let name = "Provider " + idx;
          if (p.isMetaMask) name = "MetaMask";
          else if (p.isFrame) name = "Frame";
          else if (p.isOkxWallet || p.isOKXWallet) name = "OKX Wallet";
          const opt = document.createElement("option");
          opt.value = idx;
          opt.textContent = name;
          providerSelect.appendChild(opt);
        });
        providerSelectContainer.style.display = "block";
      }

      // Utility to get the selected provider
      function getProvider() {
        if (
          window.ethereum &&
          Array.isArray(window.ethereum.providers) &&
          window.ethereum.providers.length > 1
        ) {
          const idx = parseInt(providerSelect.value || "0", 10);
          return window.ethereum.providers[idx];
        }
        return window.ethereum || null;
      }

      const connectButton = document.getElementById("connectButton");
      const sendButton = document.getElementById("sendButton");
      const signButton = document.getElementById("signButton");
      const status = document.getElementById("status");
      const txStatus = document.getElementById("txStatus");
      const signedBox = document.getElementById("signedBox");
      const signedOutput = document.getElementById("signedOutput");
      const copySigned = document.getElementById("copySigned");
      const signedHash = document.getElementById("signedHash");

      const toInputEl = document.getElementById("toInput");
      const valueInputEl = document.getElementById("valueInput");
      const dataInputEl = document.getElementById("dataInput");
      const nonceInputEl = document.getElementById("nonceInput");

      const mpgInput = document.getElementById("mpgInput");
      const mfgInput = document.getElementById("mfgInput");

      // Apply URL parameter presets (e.g. ?to=0x...)
      try {
        const params = new URLSearchParams(window.location.search);
        const setFromParam = (key, apply) => {
          const val = params.get(key);
          if (val !== null && val !== "") apply(val);
        };

        setFromParam("to", (val) => {
          toInputEl.value = val;
        });
        setFromParam("value", (val) => {
          valueInputEl.value = val;
        });
        setFromParam("data", (val) => {
          dataInputEl.value = val;
        });
        setFromParam("nonce", (val) => {
          nonceInputEl.value = val;
        });
        setFromParam("mpg", (val) => {
          mpgInput.value = val;
        });
        setFromParam("mfg", (val) => {
          mfgInput.value = val;
        });
      } catch (err) {
        console.warn("URL param parsing failed", err);
      }

      let ethProvider = null;
      let rpcProvider = null; // ethers.BrowserProvider
      let auxRpcProvider = null;
      let signer = null;
      let userAddress = null;

      if (typeof ethers === "undefined") {
        alert("Ethers.js failed to load.");
        console.error("Ethers.js undefined");
      }

      // Connect / Disconnect
      connectButton.onclick = async () => {
        if (connectButton.textContent === "Connect Wallet") {
          ethProvider = getProvider();
          if (!ethProvider) return alert("No wallet found.");
          try {
            if (ethProvider.request)
              await ethProvider.request({ method: "eth_requestAccounts" });
            else if (ethProvider.enable) await ethProvider.enable();
            rpcProvider = new ethers.BrowserProvider(ethProvider);
            signer = await rpcProvider.getSigner();
            userAddress = await signer.getAddress();

            try {
              auxRpcProvider = new ethers.JsonRpcProvider(
                "https://eth.blockrazor.xyz",
              );
              console.log("보조 RPC(provider) 연결 완료");
            } catch (auxErr) {
              console.warn("Aux RPC provider init failed", auxErr);
              auxRpcProvider = null;
            }

            status.textContent = "Connected: " + userAddress;
            connectButton.textContent = "Connected";
            sendButton.disabled = false;
            signButton.disabled = false;
          } catch (err) {
            console.error(err);
            status.textContent = "Connection failed: " + (err.message || err);
          }
        } else {
          ethProvider = null;
          rpcProvider = null;
          auxRpcProvider = null;
          signer = null;
          userAddress = null;
          status.textContent = "Not connected";
          connectButton.textContent = "Connect Wallet";
          sendButton.disabled = true;
          signButton.disabled = true;
          txStatus.textContent = "";
          signedBox.style.display = "none";
          signedOutput.value = "";
          signedHash.textContent = "";
        }
      };

      function aliasToAddress(input) {
        return input;
      }

      function toHex(bn) {
        return "0x" + bn.toString(16);
      }

      function formatGwei(bn) {
        if (bn == null) return null;
        try {
          return ethers.formatUnits(bn, "gwei");
        } catch (_) {
          return bn.toString();
        }
      }

      function readFormValues() {
        let to = aliasToAddress(toInputEl.value.trim());
        if (to && !ethers.isAddress(to)) throw new Error("Invalid To address");
        const data = dataInputEl.value.trim();
        const valueInput = valueInputEl.value.trim();
        let valueBig;
        try {
          valueBig = ethers.parseEther(valueInput || "0");
        } catch {
          throw new Error("Invalid value");
        }

        const nonceVal = nonceInputEl.value.trim();
        let nonceHex = null;
        if (nonceVal) {
          const n = parseInt(nonceVal, 10);
          if (isNaN(n) || n < 0) throw new Error("Invalid nonce");
          nonceHex = toHex(BigInt(n));
        }

        return { to, data, valueBig, nonceHex };
      }

      function getFeeOverrides() {
        const mpgStr = (mpgInput.value || "").trim();
        const mfgStr = (mfgInput.value || "").trim();
        const priority =
          mpgStr && mpgStr !== "0" ? ethers.parseUnits(mpgStr, "gwei") : null;
        const maxFee =
          mfgStr && mfgStr !== "0" ? ethers.parseUnits(mfgStr, "gwei") : null;
        return { priority, maxFee };
      }

      function getPrimaryFeeProvider() {
        return auxRpcProvider || rpcProvider;
      }

      async function computeFeePlan(
        feeProvider,
        userPriorityWei,
        userMaxFeeWei,
      ) {
        if (!feeProvider) throw new Error("No RPC provider available");

        let maxPriorityWei = userPriorityWei;
        let maxFeeWei = userMaxFeeWei;
        let gasPriceWei = null;
        let useEip1559 = false;

        const needAutoPriority = maxPriorityWei === null;
        const needAutoMaxFee = maxFeeWei === null;
        const needAuto = needAutoPriority || needAutoMaxFee;

        if (!needAuto) {
          useEip1559 = true;
        } else {
          const historyPromise = feeProvider
            .send("eth_feeHistory", ["0x2", "pending", [10, 20]])
            .then((res) => {
              const baseFees = Array.isArray(res?.baseFeePerGas)
                ? res.baseFeePerGas
                : [];
              const rewards = Array.isArray(res?.reward) ? res.reward : [];
              let baseComponent = null;
              if (baseFees.length) {
                try {
                  const lastBase = BigInt(baseFees[baseFees.length - 1]);
                  baseComponent = (lastBase * 125n + 99n) / 100n;
                } catch (_) {
                  baseComponent = null;
                }
              }
              let priorityCandidate = null;
              if (rewards.length) {
                const lastRow = rewards[rewards.length - 1];
                if (Array.isArray(lastRow) && lastRow.length > 1) {
                  try {
                    priorityCandidate = BigInt(lastRow[1]);
                  } catch (_) {
                    priorityCandidate = null;
                  }
                }
              }
              return { base: baseComponent, priority: priorityCandidate };
            })
            .catch((err) => {
              console.warn("eth_feeHistory failed", err);
              return { base: null, priority: null };
            });

          const feeDataPromise = feeProvider
            .getFeeData()
            .then((fee) => {
              return {
                priority: fee.maxPriorityFeePerGas ?? null,
                maxFee: fee.maxFeePerGas ?? null,
                gasPrice: fee.gasPrice ?? null,
              };
            })
            .catch((err) => {
              console.warn("getFeeData failed", err);
              return { priority: null, maxFee: null, gasPrice: null };
            });

          const [historyInfo, feeInfo] = await Promise.all([
            historyPromise,
            feeDataPromise,
          ]);

          gasPriceWei = feeInfo.gasPrice;

          const priorityDiff =
            historyInfo.priority != null && feeInfo.priority != null
              ? historyInfo.priority - feeInfo.priority
              : null;
          const baseDiff =
            historyInfo.base != null && feeInfo.maxFee != null
              ? historyInfo.base - (feeInfo.maxFee - (feeInfo.priority ?? 0n))
              : null;
          console.log("수수료 원본 비교", {
            historyPriorityGwei: formatGwei(historyInfo.priority),
            feeDataPriorityGwei: formatGwei(feeInfo.priority),
            priorityDiffGwei: formatGwei(priorityDiff),
            historyBaseGwei: formatGwei(historyInfo.base),
            feeDataMaxFeeGwei: formatGwei(feeInfo.maxFee),
            baseComponentDiffGwei: formatGwei(baseDiff),
            feeDataGasPriceGwei: formatGwei(feeInfo.gasPrice),
          });

          if (needAutoPriority) {
            const priorityCandidates = [];
            if (historyInfo.priority != null)
              priorityCandidates.push(historyInfo.priority);
            if (feeInfo.priority != null)
              priorityCandidates.push(feeInfo.priority);
            let selectedPriority = null;
            if (priorityCandidates.length) {
              selectedPriority = priorityCandidates.reduce((acc, val) =>
                acc < val ? acc : val,
              );
            }
            maxPriorityWei = selectedPriority;
            console.log("자동 priority 선택", {
              candidateCount: priorityCandidates.length,
              selectedPriorityGwei: formatGwei(selectedPriority),
            });
          }

          let baseComponent = historyInfo.base;
          if (baseComponent == null && feeInfo.maxFee != null) {
            const priorityForBase = maxPriorityWei ?? feeInfo.priority;
            if (priorityForBase != null) {
              const derived = feeInfo.maxFee - priorityForBase;
              if (derived > 0n) baseComponent = derived;
            }
          }

          if (needAutoMaxFee) {
            if (baseComponent != null && maxPriorityWei != null) {
              maxFeeWei = baseComponent + maxPriorityWei;
            } else if (feeInfo.maxFee != null) {
              maxFeeWei = feeInfo.maxFee;
            } else if (maxPriorityWei != null) {
              maxFeeWei = maxPriorityWei * 2n;
            }
            console.log("자동 maxFee 계산", {
              baseComponentGwei: formatGwei(baseComponent),
              selectedMaxFeeGwei: formatGwei(maxFeeWei),
            });
          }

          useEip1559 = maxPriorityWei != null && maxFeeWei != null;
        }

        if (useEip1559 && maxPriorityWei != null && maxFeeWei != null) {
          if (maxPriorityWei > maxFeeWei) {
            console.warn(
              "Fee selection: priority exceeds maxFee, clamping priority",
              {
                priority: maxPriorityWei.toString(),
                maxFee: maxFeeWei.toString(),
              },
            );
            maxPriorityWei = maxFeeWei;
          }
          console.log("최종 수수료: EIP-1559", {
            maxPriorityFeePerGas: toHex(maxPriorityWei),
            maxFeePerGas: toHex(maxFeeWei),
          });
        } else if (gasPriceWei == null) {
          const fee = await feeProvider.getFeeData();
          if (fee.gasPrice) gasPriceWei = fee.gasPrice;
          console.log("최종 수수료: legacy fallback 재조회", {
            gasPriceGwei: formatGwei(gasPriceWei),
          });
        } else {
          console.log("최종 수수료: legacy", {
            gasPriceGwei: formatGwei(gasPriceWei),
          });
        }

        return { useEip1559, maxPriorityWei, maxFeeWei, gasPriceWei };
      }

      async function estimateGasWithMargin(base, provider) {
        if (!provider) return null;
        try {
          const gasEstimate = await provider.estimateGas({
            from: base.from,
            to: base.to,
            value: base.value,
            data: base.data ?? "0x",
          });
          const gasWithMargin = (gasEstimate * 11n) / 10n;
          console.log("가스 추정", {
            estimate: gasEstimate.toString(),
            withMargin: gasWithMargin.toString(),
          });
          return toHex(gasWithMargin);
        } catch (err) {
          console.warn("Gas estimation failed", err);
          return null;
        }
      }

      async function fetchAccessList(base) {
        const params = [
          {
            from: base.from,
            to: base.to,
            value: base.value,
            data: base.data ?? "0x",
          },
          "latest",
        ];

        if (auxRpcProvider) {
          const res = await auxRpcProvider.send("eth_createAccessList", params);
          return res?.accessList ?? null;
        }
        if (ethProvider?.request) {
          const res = await ethProvider.request({
            method: "eth_createAccessList",
            params,
          });
          return res?.accessList ?? null;
        }
        return null;
      }

      async function maybeAttachAccessList(base) {
        if (base.type !== "0x2" || !base.to) return;
        try {
          const accessList = await fetchAccessList(base);
          if (!Array.isArray(accessList)) return;
          const targetAddr = base.to.toLowerCase();
          const idx = accessList.findIndex(
            (entry) => (entry.address || "").toLowerCase() === targetAddr,
          );
          if (idx !== -1 && accessList[idx].storageKeys.length <= 24) {
            accessList.splice(idx, 1);
          }
          base.accessList = accessList;
        } catch (err) {
          console.warn("Access list request failed", err);
        }
      }

      async function buildBaseTxParams() {
        if (!signer || !ethProvider || !rpcProvider || !userAddress)
          throw new Error("Connect first");

        const formValues = readFormValues();
        const base = {
          from: userAddress,
          to: formValues.to,
          value: toHex(formValues.valueBig),
        };
        if (formValues.data) base.data = formValues.data;
        if (formValues.nonceHex) base.nonce = formValues.nonceHex;

        const { priority, maxFee } = getFeeOverrides();
        const feeProvider = getPrimaryFeeProvider();
        const feePlan = await computeFeePlan(feeProvider, priority, maxFee);

        if (
          feePlan.useEip1559 &&
          feePlan.maxPriorityWei != null &&
          feePlan.maxFeeWei != null
        ) {
          base.type = "0x2";
          base.maxPriorityFeePerGas = toHex(feePlan.maxPriorityWei);
          base.maxFeePerGas = toHex(feePlan.maxFeeWei);
        } else if (feePlan.gasPriceWei != null) {
          base.gasPrice = toHex(feePlan.gasPriceWei);
        }

        const net = await feeProvider.getNetwork();
        base.chainId = toHex(net.chainId);

        const gasLimit = await estimateGasWithMargin(base, feeProvider);
        if (gasLimit) base.gas = gasLimit;

        await maybeAttachAccessList(base);

        console.log("최종 txParams", base);

        return base;
      }

      // Send transaction via eth_sendTransaction (unchanged)
      sendButton.onclick = async () => {
        if (!signer || !ethProvider || !userAddress)
          return alert("Please connect your wallet first.");
        try {
          const txParams = await buildBaseTxParams();
          console.log("전송 요청 txParams", txParams);
          sendButton.disabled = true;
          txStatus.textContent = "Awaiting approval...";
          const txHash = await ethProvider.request({
            method: "eth_sendTransaction",
            params: [txParams],
          });
          txStatus.innerHTML =
            'Tx hash: <a href="https://etherscan.io/tx/' +
            txHash +
            '" target="_blank">' +
            txHash +
            "</a>";
        } catch (err) {
          console.error(err);
          txStatus.textContent = "Error: " + (err.message || err);
        } finally {
          sendButton.disabled = false;
        }
      };

      // Sign transaction only (no send)
      signButton.onclick = async () => {
        if (!signer || !ethProvider || !userAddress)
          return alert("Please connect your wallet first.");
        signedBox.style.display = "none";
        signedOutput.value = "";
        signedHash.textContent = "";
        try {
          const txParams = await buildBaseTxParams();
          console.log("서명 요청 txParams", txParams);
          signButton.disabled = true;
          txStatus.textContent = "Requesting signature...";

          let rawResp;
          try {
            // Preferred: direct RPC (works on Frame/OKX/Rabby; MetaMask may not support)
            rawResp = await ethProvider.request({
              method: "eth_signTransaction",
              params: [txParams],
            });
          } catch (e1) {
            // Fallback to signer.signTransaction if available
            if (signer && typeof signer.signTransaction === "function") {
              const populated = await signer.populateTransaction({
                ...(txParams.to && { to: txParams.to }),
                data: txParams.data,
                value: txParams.value,
                ...(txParams.nonce && { nonce: txParams.nonce }),
                maxFeePerGas: txParams.maxFeePerGas,
                maxPriorityFeePerGas: txParams.maxPriorityFeePerGas,
                //gasPrice: txParams.gasPrice,
                type: txParams.type ? Number(txParams.type) : undefined,
                //chainId: txParams.chainId,
                accessList: txParams.accessList,
              });
              console.log("populateTransaction 결과", populated);
              if (populated?.gasLimit)
                console.log("populateTransaction gasLimit", populated.gasLimit);
              rawResp = await signer.signTransaction(populated);
            } else {
              throw new Error(
                e1 && e1.message
                  ? e1.message +
                    " — Your wallet may not support sign-only. Try Frame/OKX/Rabby or a wallet that supports eth_signTransaction."
                  : "Wallet does not support sign-only signing",
              );
            }
          }

          // Normalize response to hex string
          let rawHex = "";
          if (typeof rawResp === "string") rawHex = rawResp;
          else if (rawResp && typeof rawResp === "object")
            rawHex = rawResp.signedTx || rawResp.raw || rawResp.tx || "";
          if (
            !rawHex ||
            typeof rawHex !== "string" ||
            !rawHex.startsWith("0x")
          ) {
            // Still show diagnostic but do not crash
            throw new Error(
              "Wallet returned unexpected format for signed tx. Inspect console.",
            );
          }

          const hash = ethers.keccak256(rawHex);
          signedOutput.value = rawHex;
          signedHash.textContent =
            "Tx hash (keccak of signed raw): " + hash + " — not broadcasted";
          signedBox.style.display = "block";
          txStatus.textContent =
            "Signed only. Save the raw hex to broadcast later.";
        } catch (err) {
          console.error(err);
          txStatus.textContent = "Sign error: " + (err.message || err);
        } finally {
          signButton.disabled = false;
        }
      };

      copySigned.onclick = async () => {
        try {
          await navigator.clipboard.writeText(signedOutput.value.trim());
          if (!signedHash.textContent) {
            signedHash.textContent = "Copied";
          } else if (!signedHash.textContent.includes(" — Copied")) {
            signedHash.textContent += " — Copied";
          }
        } catch (_) {}
      };
    </script>
  </body>
</html>
